name: Build App for eSign

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Export iOS Bundle
        run: npx expo export --platform ios

      - name: Archive and Prepare for eSign
        run: |
          mkdir -p Payload
          mv dist Payload/FireTV.app || cp -r dist Payload/FireTV.app
          zip -r FireTV-eSign.zip Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireTV-eSign
          path: FireTV-eSign.zip
