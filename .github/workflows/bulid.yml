name: Build Unsigned IPA (for Esign)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # يتيح التشغيل يدوياً من تبويب Actions

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli

      # إنشاء مجلد iOS الأصلي من مشروع Expo
      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --clean

      # استخراج اسم المشروع مع إزالة المسافات (لأن Scheme لا يحب المسافات)
      - name: Get project name
        id: project_name
        run: |
          # جلب الاسم من app.json وإزالة أي مسافات بيضاء
          RAW_NAME=$(node -p "require('./app.json').expo.name")
          CLEAN_NAME=$(echo "$RAW_NAME" | tr -d ' ')
          echo "PROJECT_NAME=$CLEAN_NAME" >> $GITHUB_ENV
          echo "Cleaned project name: $CLEAN_NAME"

      # بناء التطبيق بدون أي توقيع (Unsigned)
      - name: Build unsigned .app
        run: |
          cd ios
          # وضع اسم المشروع بين علامات اقتباس مزدوجة لتفادي مشكلة المسافات
          xcodebuild -workspace *.xcworkspace \
            -scheme "${{ env.PROJECT_NAME }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/${{ env.PROJECT_NAME }}.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER=""
          
          # استخراج ملف .app من الأرشيف ووضعه في مجلد Payload
          mkdir -p Payload
          cp -R build/${{ env.PROJECT_NAME }}.xcarchive/Products/Applications/${{ env.PROJECT_NAME }}.app Payload/

      # ضغط مجلد Payload إلى ملف .ipa (غير موقع)
      - name: Package as unsigned .ipa
        run: |
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload
          echo "Unsigned IPA created successfully"

      # رفع الملف الناتج (ستجده في قسم Artifacts)
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: ${{ env.PROJECT_NAME }}.ipa
