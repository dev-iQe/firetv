name: Build Unsigned IPA (for Esign)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # يتيح لك الضغط على زر "Run workflow" يدوياً

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20          # تم التحديث من 18 إلى 20 (LTS)
          cache: 'npm'

      # ✅ الحل السحري: استخدم install بدلاً من ci (لأن ملف lock غير موجود بالمستودع)
      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI
        run: npm install -g expo-cli

      # إنشاء مجلد iOS الأصلي من مشروع Expo
      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --clean

      # استخراج اسم المشروع وإزالة المسافات ليتوافق مع Xcode Scheme
      - name: Get project name
        id: project_name
        run: |
          RAW_NAME=$(node -p "require('./app.json').expo.name")
          CLEAN_NAME=$(echo "$RAW_NAME" | tr -d ' ')
          echo "PROJECT_NAME=$CLEAN_NAME" >> $GITHUB_ENV
          echo "Cleaned project name: $CLEAN_NAME"

      # بناء التطبيق بدون أي توقيع (Unsigned) مع تجاهل التوقيع تماماً
      - name: Build unsigned .app
        run: |
          cd ios
          # بناء الأرشيف
          xcodebuild -workspace *.xcworkspace \
            -scheme "${{ env.PROJECT_NAME }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/${{ env.PROJECT_NAME }}.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER=""
          
          # تحضير مجلد Payload
          mkdir -p Payload
          
          # ✅ البحث التلقائي عن ملف .app داخل الأرشيف (أكثر أماناً من كتابة الاسم يدوياً)
          APP_PATH=$(find build/${{ env.PROJECT_NAME }}.xcarchive/Products/Applications -name "*.app" | head -n 1)
          cp -R "$APP_PATH" Payload/

      # ضغط مجلد Payload إلى ملف .ipa (غير موقع)
      - name: Package as unsigned .ipa
        run: |
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload
          echo "Unsigned IPA created successfully"

      # رفع الملف الناتج (ستجده في قسم Artifacts بعد انتهاء التشغيل)
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: ${{ env.PROJECT_NAME }}.ipa
